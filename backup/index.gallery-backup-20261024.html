<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="何意味：四张节奏游戏截图的私人存档。">
  <title>何意味 · 私人截图存档</title>
  <style>
    :root {
      --blue: #2f6fed;
      --blue-deep: #1f4f9e;
      --blue-pale: #e8f1ff;
      --ink: #1e334d;
      --muted: #77879b;
      --paper: #f7faff;
      --line: rgba(52, 91, 140, 0.15);
      --slide-w: clamp(408px, 74vw, 840px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 9% 2%, rgba(126, 177, 255, 0.2), transparent 31rem),
        radial-gradient(circle at 94% 26%, rgba(157, 208, 255, 0.14), transparent 28rem),
        linear-gradient(180deg, #fbfdff 0%, var(--paper) 58%, #f4f8fe 100%);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(72, 118, 175, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 118, 175, 0.035) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 72%);
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    button:focus-visible,
    .gallery:focus-visible {
      outline: 3px solid rgba(47, 111, 237, 0.28);
      outline-offset: 5px;
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 2px 22px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #617690;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.08em;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--blue);
      box-shadow: 5px 5px 0 #bad5ff;
      transform: translateY(-2px);
    }

    .frame-count {
      color: #92a1b3;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      letter-spacing: 0.09em;
    }

    .intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 44px;
      padding: 20px 2px 26px;
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7589a2;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .kicker::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--blue);
    }

    h1 {
      position: relative;
      width: fit-content;
      margin-top: 12px;
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: clamp(78px, 10.2vw, 132px);
      font-weight: 500;
      line-height: 0.94;
      letter-spacing: 0.01em;
    }

    h1::after {
      content: "";
      position: absolute;
      right: -22px;
      bottom: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      opacity: 0.9;
    }

    .title-underline {
      display: block;
      width: min(100%, 400px);
      height: 23px;
      margin-top: 4px;
      overflow: visible;
      color: var(--blue);
    }

    .side-note {
      position: relative;
      max-width: 210px;
      margin: 0 8px 18px 0;
      padding-left: 15px;
      color: #627c9a;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: 16px;
      line-height: 1.7;
      transform: rotate(-1.6deg);
    }

    .side-note::before {
      content: "";
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, #9dbbe2, transparent);
    }

    .gallery {
      position: relative;
      overflow: hidden;
      padding-bottom: 2px;
      touch-action: pan-x;
    }

    .gallery-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px calc((100% - var(--slide-w)) / 2) 17px;
      scroll-padding-inline: calc((100% - var(--slide-w)) / 2);
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      cursor: grab;
      overscroll-behavior-x: contain;
    }

    .gallery-track::-webkit-scrollbar {
      display: none;
    }

    .gallery-track.dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      user-select: none;
    }

    .photo {
      position: relative;
      flex: 0 0 var(--slide-w);
      scroll-snap-align: center;
      scroll-snap-stop: always;
      opacity: 0.72;
      transition: opacity 0.45s ease;
    }

    .photo:not(.is-active) {
      cursor: pointer;
    }

    .shot {
      position: relative;
      padding: 10px 10px 0;
      border: 1px solid rgba(56, 92, 135, 0.13);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 34px rgba(47, 83, 130, 0.08);
      transform: scale(0.955);
      transform-origin: center;
      transition: transform 0.45s ease, box-shadow 0.45s ease;
    }

    .photo.is-active .shot {
      box-shadow: 0 28px 65px rgba(41, 78, 128, 0.16);
      transform: scale(1);
    }

    .photo.is-active .shot::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: -8px;
      left: 50%;
      width: 68px;
      height: 17px;
      border: 1px solid rgba(109, 161, 233, 0.18);
      background: rgba(181, 211, 255, 0.38);
      transform: translateX(-50%) rotate(-2deg);
      backdrop-filter: blur(3px);
    }

    .image-wrap {
      overflow: hidden;
      aspect-ratio: 1080 / 746;
      background: #dfe9f6;
      border-radius: 2px;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(5px) saturate(0.72);
      transform: scale(1.06);
      transition: filter 0.45s ease, transform 0.45s ease;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .photo.is-active .image-wrap img {
      filter: blur(0) saturate(1);
      transform: scale(1);
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 11px 4px 12px;
      color: #8292a5;
      font-size: 11px;
      white-space: nowrap;
    }

    .photo-number {
      flex: 0 0 auto;
      color: var(--blue);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .song-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-name {
      flex: 0 0 auto;
      margin-left: auto;
      color: #a3afbd;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.1em;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 12px 0 20px;
    }

    .position {
      display: flex;
      align-items: baseline;
      gap: 5px;
      color: #a0adbc;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
    }

    .position strong {
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
    }

    .indexes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .index-button {
      min-width: 32px;
      padding: 7px 4px 5px;
      color: #a1adbb;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 9px;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .index-button:hover {
      color: var(--blue);
    }

    .index-button[aria-current="true"] {
      color: var(--blue-deep);
      border-bottom-color: var(--blue);
    }

    .arrows {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }

    .arrow-button {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      color: #526e8f;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.74);
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .arrow-button:hover:not(:disabled) {
      color: white;
      background: var(--blue);
      transform: translateY(-2px);
    }

    .arrow-button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .arrow-button svg {
      width: 16px;
      height: 16px;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 17px 2px 24px;
      color: #a0adbd;
      font-size: 10px;
      border-top: 1px solid rgba(71, 108, 153, 0.1);
    }

    .footer span:last-child {
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: 0.04em;
    }

    @media (max-width: 760px) {
      :root {
        --slide-w: calc(100vw - 96px);
      }

      .page {
        width: calc(100% - 32px);
      }

      .topbar {
        padding: 21px 0 18px;
      }

      .intro {
        align-items: flex-start;
        flex-direction: column;
        gap: 15px;
        padding: 18px 0 25px;
      }

      h1 {
        font-size: clamp(70px, 22vw, 100px);
      }

      .title-underline {
        width: min(78%, 300px);
      }

      .side-note {
        max-width: none;
        margin: 0 0 0 4px;
        font-size: 14px;
        line-height: 1.55;
        transform: rotate(-0.8deg);
      }

      .gallery-track {
        gap: 12px;
        padding-top: 10px;
        padding-bottom: 13px;
      }

      .shot {
        padding: 7px 7px 0;
      }

      .photo.is-active .shot::before {
        top: -6px;
        width: 54px;
        height: 13px;
      }

      figcaption {
        gap: 7px;
        padding: 8px 2px 9px;
        font-size: 9px;
      }

      .photo-number {
        font-size: 9px;
      }

      .game-name {
        display: none;
      }

      .controls {
        gap: 10px;
        padding: 8px 0 15px;
      }

      .position {
        font-size: 9px;
      }

      .position strong {
        font-size: 11px;
      }

      .indexes {
        gap: 0;
      }

      .index-button {
        min-width: 26px;
        padding: 6px 3px 4px;
      }

      .arrow-button {
        width: 34px;
        height: 34px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
        padding-bottom: 19px;
      }
    }

    @media (max-width: 360px) {
      :root {
        --slide-w: calc(100vw - 74px);
      }

      .index-button {
        min-width: 23px;
      }

      .arrow-button {
        width: 31px;
        height: 31px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        私人截图存档
      </div>
      <div class="frame-count">04 FRAMES / 2026</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div>
          <p class="kicker">打歌截图，随手存。</p>
          <h1 id="page-title">何意味</h1>
          <svg class="title-underline" viewBox="0 0 400 24" fill="none" aria-hidden="true">
            <path d="M3 16C88 5 257 3 394 10" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/>
            <path d="M57 21C143 12 252 11 335 17" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity=".48"/>
          </svg>
        </div>
        <p class="side-note">打得好不好不重要，<br>歌好听就行。</p>
      </section>

      <section class="gallery" id="gallery" aria-label="图片浏览，共四张" tabindex="0">
        <div class="gallery-track" id="gallery-track">
          <figure class="photo is-active" data-index="0">
            <div class="shot">
              <div class="image-wrap">
                <img
                  src="images/01.jpg"
                  alt="CHUNITHM《祈 -我ら神祖と共に歩む者なり-》结算画面，评级 S"
                  width="1080" height="746" draggable="false">
              </div>
              <figcaption>
                <span class="photo-number">01</span>
                <span class="song-name">祈 -我ら神祖と共に歩む者なり-</span>
                <span class="game-name">CHUNITHM</span>
              </figcaption>
            </div>
          </figure>

          <figure class="photo" data-index="1">
            <div class="shot">
              <div class="image-wrap">
                <img
                  src="images/02.jpg"
                  alt="Arcaea《BREaK! BREaK! BREaK!》结算画面，评级 EX"
                  width="1080" height="746" draggable="false">
              </div>
              <figcaption>
                <span class="photo-number">02</span>
                <span class="song-name">BREaK! BREaK! BREaK!</span>
                <span class="game-name">ARCAEA</span>
              </figcaption>
            </div>
          </figure>

          <figure class="photo" data-index="2">
            <div class="shot">
              <div class="image-wrap">
                <img
                  src="images/03.jpg"
                  alt="音乐游戏《HELL! or HELL?》结算画面，评级 SS"
                  width="1080" height="746" draggable="false">
              </div>
              <figcaption>
                <span class="photo-number">03</span>
                <span class="song-name">HELL! or HELL?</span>
                <span class="game-name">RHYTHM GAME</span>
              </figcaption>
            </div>
          </figure>

          <figure class="photo" data-index="3">
            <div class="shot">
              <div class="image-wrap">
                <img
                  src="images/04.jpg"
                  alt="Arcaea《Infinity Heaven》选曲画面，难度 EX+"
                  width="1080" height="746" draggable="false">
              </div>
              <figcaption>
                <span class="photo-number">04</span>
                <span class="song-name">Infinity Heaven</span>
                <span class="game-name">ARCAEA</span>
              </figcaption>
            </div>
          </figure>
        </div>
      </section>

      <div class="controls" aria-label="图片切换控制">
        <p class="position"><strong id="current-number">01</strong><span>/</span><span>04</span></p>

        <div class="indexes">
          <button class="index-button" type="button" data-target="0" aria-label="查看第 1 张图片" aria-current="true">01</button>
          <button class="index-button" type="button" data-target="1" aria-label="查看第 2 张图片" aria-current="false">02</button>
          <button class="index-button" type="button" data-target="2" aria-label="查看第 3 张图片" aria-current="false">03</button>
          <button class="index-button" type="button" data-target="3" aria-label="查看第 4 张图片" aria-current="false">04</button>
        </div>

        <div class="arrows">
          <button class="arrow-button" id="prev-button" type="button" aria-label="上一张" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5M11 18l-6-6 6-6"/>
            </svg>
          </button>
          <button class="arrow-button" id="next-button" type="button" aria-label="下一张">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span>横向拖动，或使用 ← → 切换</span>
      <span>© 2026 / 何意味</span>
    </footer>
  </div>

  <script>
    (() => {
      const gallery = document.getElementById("gallery");
      const track = document.getElementById("gallery-track");
      const frames = Array.from(track.querySelectorAll(".photo"));
      const indexButtons = Array.from(document.querySelectorAll(".index-button"));
      const currentNumber = document.getElementById("current-number");
      const prevButton = document.getElementById("prev-button");
      const nextButton = document.getElementById("next-button");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let activeIndex = 0;
      let ticking = false;
      let isDragging = false;
      let dragMoved = false;
      let dragStartX = 0;
      let dragStartLeft = 0;
      let suppressClick = false;

      const clamp = (value) => Math.max(0, Math.min(frames.length - 1, value));
      const pad = (value) => String(value + 1).padStart(2, "0");

      function setActive(index) {
        activeIndex = clamp(index);
        frames.forEach((frame, i) => {
          frame.classList.toggle("is-active", i === activeIndex);
        });
        indexButtons.forEach((button, i) => {
          button.setAttribute("aria-current", String(i === activeIndex));
        });
        currentNumber.textContent = pad(activeIndex);
        prevButton.disabled = activeIndex === 0;
        nextButton.disabled = activeIndex === frames.length - 1;
      }

      function nearestIndex() {
        const trackRect = track.getBoundingClientRect();
        const center = trackRect.left + track.clientWidth / 2;
        let nearest = 0;
        let shortest = Infinity;

        frames.forEach((frame, i) => {
          const rect = frame.getBoundingClientRect();
          const distance = Math.abs(rect.left + rect.width / 2 - center);
          if (distance < shortest) {
            shortest = distance;
            nearest = i;
          }
        });

        return nearest;
      }

      function goTo(index, behavior = "smooth") {
        const nextIndex = clamp(index);
        const frame = frames[nextIndex];
        const trackRect = track.getBoundingClientRect();
        const frameRect = frame.getBoundingClientRect();
        const frameCenter = track.scrollLeft + frameRect.left - trackRect.left + frame.offsetWidth / 2;
        const left = frameCenter - track.clientWidth / 2;

        track.scrollTo({
          left,
          behavior: reduceMotion ? "auto" : behavior
        });
      }

      function syncActive() {
        const nearest = nearestIndex();
        if (nearest !== activeIndex) setActive(nearest);
        ticking = false;
      }

      track.addEventListener("scroll", () => {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(syncActive);
        }
      }, { passive: true });

      indexButtons.forEach((button) => {
        button.addEventListener("click", () => goTo(Number(button.dataset.target)));
      });

      prevButton.addEventListener("click", () => goTo(activeIndex - 1));
      nextButton.addEventListener("click", () => goTo(activeIndex + 1));

      gallery.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          goTo(activeIndex - 1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          goTo(activeIndex + 1);
        }
      });

      track.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "mouse" || event.button !== 0) return;
        isDragging = true;
        dragMoved = false;
        dragStartX = event.clientX;
        dragStartLeft = track.scrollLeft;
        track.classList.add("dragging");
        track.setPointerCapture(event.pointerId);
      });

      track.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        const distance = event.clientX - dragStartX;
        if (Math.abs(distance) > 4) dragMoved = true;
        track.scrollLeft = dragStartLeft - distance;
      });

      function finishDrag(event) {
        if (!isDragging) return;
        isDragging = false;
        track.classList.remove("dragging");
        if (track.hasPointerCapture(event.pointerId)) {
          track.releasePointerCapture(event.pointerId);
        }
        if (dragMoved) {
          suppressClick = true;
          goTo(nearestIndex());
          window.setTimeout(() => {
            suppressClick = false;
          }, 60);
        }
      }

      track.addEventListener("pointerup", finishDrag);
      track.addEventListener("pointercancel", finishDrag);

      track.addEventListener("click", (event) => {
        if (suppressClick) return;
        const frame = event.target.closest(".photo");
        if (frame) goTo(Number(frame.dataset.index));
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => goTo(activeIndex, "auto"), 120);
      });

      requestAnimationFrame(() => {
        goTo(0, "auto");
        setActive(0);
      });
    })();
  </script>
</body>
</html>
