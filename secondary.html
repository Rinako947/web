<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="明代致远的私人空间：收藏生活片段、灵感与游戏截图。">
  <title>明代致远 · 何意味</title>
  <style>
    :root {
      --blue: #2f6fed;
      --blue-deep: #1f4f9e;
      --blue-pale: #e8f1ff;
      --ink: #1e334d;
      --muted: #728399;
      --paper: #f7faff;
      --white: #ffffff;
      --line: rgba(52, 91, 140, 0.15);
      --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      --serif: "Songti SC", "STSong", "SimSun", Georgia, serif;
      --slide-w: clamp(408px, 74vw, 840px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 8% 0%, rgba(126, 177, 255, 0.19), transparent 33rem),
        radial-gradient(circle at 96% 24%, rgba(157, 208, 255, 0.13), transparent 28rem),
        linear-gradient(180deg, #fbfdff 0%, var(--paper) 48%, #f4f8fe 100%);
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(72, 118, 175, 0.034) 1px, transparent 1px),
        linear-gradient(90deg, rgba(72, 118, 175, 0.034) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(to bottom, black, transparent 45%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    a:focus-visible,
    .gallery:focus-visible {
      outline: 3px solid rgba(47, 111, 237, 0.28);
      outline-offset: 5px;
      border-radius: 4px;
    }

    img {
      max-width: 100%;
    }

    [hidden] {
      display: none !important;
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      opacity: 0.55;
      background: rgba(137, 187, 255, 0.12);
      filter: blur(28px);
      animation: ambientDrift 16s ease-in-out infinite;
    }

    .ambient-orb-a {
      top: 4%;
      left: -12rem;
      width: 28rem;
      height: 28rem;
    }

    .ambient-orb-b {
      right: -10rem;
      bottom: 7%;
      width: 24rem;
      height: 24rem;
      animation-direction: reverse;
      animation-duration: 21s;
    }

    @keyframes ambientDrift {
      50% {
        transform: translate3d(34px, 28px, 0) scale(1.06);
      }
    }

    .page {
      position: relative;
      z-index: 1;
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid rgba(72, 110, 158, 0.09);
      background: rgba(249, 252, 255, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-inner {
      width: min(1120px, calc(100% - 48px));
      height: 72px;
      display: flex;
      align-items: center;
      gap: 30px;
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 9px;
      flex: 0 0 auto;
    }

    .brand::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      align-self: center;
      margin-right: -2px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 0 4px rgba(47, 111, 237, 0.1);
    }

    .brand-name {
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .brand-sub {
      color: #98a6b7;
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.12em;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 27px;
      margin-left: auto;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav::-webkit-scrollbar {
      display: none;
    }

    .nav a {
      position: relative;
      padding: 8px 0;
      color: #6d7e92;
      font-size: 12px;
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav a:hover,
    .nav a.is-active {
      color: var(--blue);
    }

    .nav a::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 0;
      height: 1px;
      border-radius: 2px;
      background: var(--blue);
      transform: translateX(-50%);
      transition: width 0.25s ease;
    }

    .nav a.is-active::after {
      width: 14px;
    }

    .scroll-progress {
      position: absolute;
      left: 0;
      bottom: -1px;
      width: 100%;
      height: 1px;
      overflow: hidden;
    }

    .scroll-progress span {
      display: block;
      width: 100%;
      height: 100%;
      background: rgba(47, 111, 237, 0.45);
      transform: scaleX(0);
      transform-origin: left;
      will-change: transform;
    }

    .section-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .section-label::before {
      content: "";
      width: 22px;
      height: 1px;
      background: #a6c3e7;
    }

    .about {
      position: relative;
      min-height: calc(100svh - 73px);
      display: grid;
      grid-template-columns: minmax(0, 1.04fr) minmax(370px, 0.96fr);
      align-items: center;
      gap: 34px;
      padding: 56px 0 68px;
      scroll-margin-top: 88px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
      padding-bottom: 14px;
    }

    .hero-title-row {
      display: flex;
      align-items: flex-end;
      gap: 20px;
      margin-top: 22px;
    }

    .hero-title {
      margin-top: 0;
      font-family: var(--serif);
      font-size: clamp(62px, 7.4vw, 104px);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-shadow: 0 12px 34px rgba(47, 111, 237, 0.055);
    }

    .hero-title .name-blue {
      color: var(--blue);
    }

    .hero-seal {
      position: relative;
      width: 47px;
      height: 57px;
      display: flex;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      flex: 0 0 auto;
      gap: 1px;
      margin-bottom: 8px;
      color: var(--blue);
      font-family: var(--serif);
      font-size: 17px;
      line-height: 1.1;
      border: 1px solid rgba(47, 111, 237, 0.34);
      border-radius: 6px 9px 5px 8px;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 0 0 3px rgba(47, 111, 237, 0.045);
      opacity: 0.92;
      transform: rotate(3deg);
    }

    .hero-seal::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px solid rgba(47, 111, 237, 0.12);
      border-radius: 3px 6px 2px 5px;
      pointer-events: none;
    }

    .title-rule {
      width: min(72%, 270px);
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 21px;
      pointer-events: none;
    }

    .title-rule span {
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, rgba(47, 111, 237, 0.42), rgba(47, 111, 237, 0.035));
    }

    .title-rule i {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(47, 111, 237, 0.42);
    }

    .hero-text {
      max-width: 420px;
      margin-top: 17px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.95;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 25px;
    }

    .hero-tags span {
      padding: 6px 10px;
      color: #617b9b;
      font-size: 9px;
      border: 1px solid rgba(79, 120, 171, 0.11);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.55);
    }

    .scroll-cue {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      margin-top: 39px;
      color: #6482a5;
      border: 1px solid rgba(65, 108, 160, 0.17);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.55);
      transition: color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .scroll-cue:hover {
      color: white;
      background: var(--blue);
      transform: translateY(3px);
    }

    .scroll-cue svg {
      width: 15px;
      height: 15px;
      animation: cueDrop 2.4s ease-in-out infinite;
    }

    @keyframes cueDrop {
      50% {
        transform: translateY(3px);
      }
    }

    .hero-art {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 470px;
      isolation: isolate;
    }

    .hero-art::before {
      content: "";
      position: absolute;
      z-index: -2;
      width: min(86%, 500px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 38%, rgba(255, 255, 255, 0.92), rgba(226, 240, 255, 0.72) 62%, rgba(226, 240, 255, 0));
    }

    .hero-art::after {
      content: "";
      position: absolute;
      z-index: -1;
      top: 4%;
      right: 1%;
      width: 112px;
      height: 112px;
      background-image: radial-gradient(rgba(95, 146, 205, 0.35) 1.2px, transparent 1.2px);
      background-size: 13px 13px;
      opacity: 0.42;
      transform: rotate(8deg);
    }

    .art-mouse-layer {
      width: 100%;
      max-width: 560px;
      transform: translate3d(var(--art-x, 0), var(--art-y, 0), 0);
      transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
      will-change: transform;
    }

    .art-svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .cassette-float {
      animation: floatY 7s ease-in-out infinite;
    }

    .reel {
      transform-box: fill-box;
      transform-origin: center;
      animation: reelSpin 16s linear infinite;
    }

    .reel-b {
      animation-direction: reverse;
      animation-duration: 19s;
    }

    .note-a {
      transform-box: fill-box;
      transform-origin: center;
      animation: noteFloat 5.5s ease-in-out infinite;
    }

    .note-b {
      transform-box: fill-box;
      transform-origin: center;
      animation: noteFloat 6.8s ease-in-out infinite reverse;
    }

    @keyframes floatY {
      50% {
        transform: translateY(-8px) rotate(0.5deg);
      }
    }

    @keyframes reelSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes noteFloat {
      50% {
        transform: translateY(-7px) rotate(-2deg);
      }
    }

    .reveal .draw-line {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .reveal.is-visible .draw-line {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1.7s 0.2s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .section {
      padding-top: 104px;
      scroll-margin-top: 88px;
    }

    .section-heading {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 32px;
      margin-bottom: 37px;
      padding-bottom: 21px;
      border-bottom: 1px solid var(--line);
    }

    .section-heading::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: -2.5px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #9dc2ea;
    }

    .section-heading h2 {
      margin-top: 8px;
      font-family: var(--serif);
      font-size: clamp(36px, 4vw, 47px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0.01em;
    }

    .heading-mark {
      width: 74px;
      height: 31px;
      margin-bottom: 5px;
      color: #83a8d4;
      overflow: visible;
    }

    .life-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
      gap: 18px;
      padding-bottom: 42px;
    }

    .life-reveal:nth-child(2) {
      margin-top: 35px;
    }

    .life-reveal:nth-child(3) {
      margin-top: 12px;
    }

    .life-card {
      position: relative;
      min-height: 222px;
      padding: 25px;
      overflow: hidden;
      border: 1px solid rgba(64, 102, 149, 0.12);
      border-radius: 21px;
      background:
        radial-gradient(circle at 90% 9%, rgba(220, 236, 255, 0.42), transparent 9rem),
        rgba(255, 255, 255, 0.72);
      box-shadow: 0 12px 34px rgba(49, 84, 130, 0.05);
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .life-card::after {
      content: "";
      position: absolute;
      right: -54px;
      bottom: -67px;
      width: 154px;
      height: 154px;
      border-radius: 50%;
      background: rgba(233, 243, 255, 0.8);
      pointer-events: none;
    }

    .life-card:hover {
      transform: translateY(-7px);
      border-color: rgba(47, 111, 237, 0.23);
      box-shadow: 0 21px 44px rgba(49, 84, 130, 0.1);
    }

    .life-top {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .life-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: var(--blue);
      border: 1px solid #dce9fa;
      border-radius: 50%;
      background: #f4f9ff;
      transition: transform 0.3s ease;
    }

    .life-card:hover .life-icon {
      transform: rotate(-5deg) scale(1.05);
    }

    .life-icon svg {
      width: 25px;
      height: 25px;
    }

    .life-number {
      color: #c5d2e1;
      font-family: var(--mono);
      font-size: 9px;
      transition: color 0.3s ease;
    }

    .life-card:hover .life-number {
      color: var(--blue);
    }

    .life-card h3 {
      position: relative;
      z-index: 1;
      margin-top: 34px;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 550;
      letter-spacing: 0.01em;
    }

    .life-card p {
      position: relative;
      z-index: 1;
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.8;
    }

    .gallery-feature {
      padding-top: 112px;
      scroll-margin-top: 88px;
    }

    .gallery-intro {
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 44px;
      padding: 0 2px 10px;
    }

    .gallery-kicker {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 19px;
      color: #7589a2;
      font-size: 12px;
      letter-spacing: 0.04em;
    }

    .gallery-kicker::before {
      content: "";
      width: 18px;
      height: 1px;
      background: var(--blue);
    }

    h1 {
      position: relative;
      width: fit-content;
      margin-top: 9px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(76px, 9.8vw, 126px);
      font-weight: 500;
      line-height: 0.94;
      letter-spacing: 0.01em;
    }

    h1::after {
      content: "";
      position: absolute;
      right: -22px;
      bottom: 8px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--blue);
      opacity: 0.9;
      animation: dotBreath 4s ease-in-out infinite;
    }

    @keyframes dotBreath {
      50% {
        transform: scale(0.72);
        opacity: 0.5;
      }
    }

    .title-underline {
      display: block;
      width: min(100%, 380px);
      height: 22px;
      margin-top: 3px;
      overflow: visible;
      color: var(--blue);
    }

    .title-underline path {
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }

    .gallery-intro.is-visible .title-underline path {
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1.4s 0.25s ease;
    }

    .gallery-aside {
      position: relative;
      flex: 0 0 255px;
      margin-bottom: 20px;
      padding-left: 13px;
      transform: rotate(-1.1deg);
    }

    .wave-doodle {
      display: block;
      width: 100%;
      height: 78px;
      margin-bottom: 11px;
      color: #8db4e5;
      overflow: visible;
    }

    .side-note {
      color: #617b9a;
      font-family: "KaiTi", "STKaiti", "Microsoft YaHei", serif;
      font-size: 16px;
      line-height: 1.65;
      text-align: right;
    }

    .gallery {
      position: relative;
      overflow: hidden;
      padding-bottom: 2px;
      touch-action: pan-x;
    }

    .gallery-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 8px calc((100% - var(--slide-w)) / 2) 17px;
      scroll-padding-inline: calc((100% - var(--slide-w)) / 2);
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      cursor: grab;
      overscroll-behavior-x: contain;
    }

    .gallery-track::-webkit-scrollbar {
      display: none;
    }

    .gallery-track.dragging {
      cursor: grabbing;
      scroll-snap-type: none;
      user-select: none;
    }

    .photo {
      position: relative;
      flex: 0 0 var(--slide-w);
      scroll-snap-align: center;
      scroll-snap-stop: always;
      opacity: 0.72;
      transition: opacity 0.45s ease;
    }

    .photo:not(.is-active) {
      cursor: pointer;
    }

    .shot {
      position: relative;
      padding: 10px 10px 0;
      border: 1px solid rgba(56, 92, 135, 0.13);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 34px rgba(47, 83, 130, 0.08);
      transform: scale(0.955);
      transform-origin: center;
      transition: transform 0.45s ease, box-shadow 0.45s ease;
    }

    .photo.is-active .shot {
      box-shadow: 0 28px 65px rgba(41, 78, 128, 0.16);
      transform: scale(1);
    }

    .photo.is-active .shot::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: -8px;
      left: 50%;
      width: 68px;
      height: 17px;
      border: 1px solid rgba(109, 161, 233, 0.18);
      background: rgba(181, 211, 255, 0.38);
      transform: translateX(-50%) rotate(-2deg);
      backdrop-filter: blur(3px);
    }

    .image-wrap {
      overflow: hidden;
      aspect-ratio: 1080 / 746;
      background: #dfe9f6;
      border-radius: 2px;
    }

    .image-wrap img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(5px) saturate(0.72);
      transform: scale(1.06);
      transition: filter 0.45s ease, transform 0.45s ease;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .photo.is-active .image-wrap img {
      filter: blur(0) saturate(1);
      transform: scale(1);
    }

    figcaption {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 11px 4px 12px;
      color: #8292a5;
      font-size: 11px;
      white-space: nowrap;
    }

    .photo-number {
      flex: 0 0 auto;
      color: var(--blue);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .song-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-name {
      flex: 0 0 auto;
      margin-left: auto;
      color: #a3afbd;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: 0.1em;
    }

    .gallery-controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      padding: 12px 0 4px;
    }

    .position {
      display: flex;
      align-items: baseline;
      gap: 5px;
      color: #a0adbc;
      font-family: var(--mono);
      font-size: 10px;
    }

    .position strong {
      color: var(--ink);
      font-size: 12px;
      font-weight: 650;
    }

    .indexes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .index-button {
      min-width: 32px;
      padding: 7px 4px 5px;
      color: #a1adbb;
      font-family: var(--mono);
      font-size: 9px;
      border: 0;
      border-bottom: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .index-button:hover {
      color: var(--blue);
    }

    .index-button[aria-current="true"] {
      color: var(--blue-deep);
      border-bottom-color: var(--blue);
    }

    .arrows {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }

    .arrow-button {
      width: 38px;
      height: 38px;
      display: grid;

  <script>
    (() => {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const revealItems = Array.from(document.querySelectorAll("[data-reveal]"));

      if (!reduceMotion && "IntersectionObserver" in window) {
        revealItems.forEach((item) => item.classList.add("reveal"));

        const revealObserver = new IntersectionObserver((entries, observer) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          });
        }, {
          threshold: 0.12,
          rootMargin: "0px 0px -7% 0px"
        });

        revealItems.forEach((item) => revealObserver.observe(item));

        const intro = document.querySelector(".gallery-intro");
        if (intro) {
          const introObserver = new IntersectionObserver((entries, observer) => {
            if (!entries[0].isIntersecting) return;
            intro.classList.add("is-visible");
            observer.disconnect();
          }, { threshold: 0.2 });
          introObserver.observe(intro);
        }
      } else {
        revealItems.forEach((item) => item.classList.add("is-visible"));
        const intro = document.querySelector(".gallery-intro");
        if (intro) intro.classList.add("is-visible");
      }

      const hero = document.querySelector(".about");
      const heroArt = document.querySelector(".hero-art");

      if (hero && heroArt && !reduceMotion && window.matchMedia("(pointer: fine)").matches) {
        hero.addEventListener("pointermove", (event) => {
          const rect = heroArt.getBoundingClientRect();
          const x = (event.clientX - rect.left) / rect.width - 0.5;
          const y = (event.clientY - rect.top) / rect.height - 0.5;
          heroArt.style.setProperty("--art-x", `${(x * 14).toFixed(2)}px`);
          heroArt.style.setProperty("--art-y", `${(y * 11).toFixed(2)}px`);
        });

        hero.addEventListener("pointerleave", () => {
          heroArt.style.setProperty("--art-x", "0px");
          heroArt.style.setProperty("--art-y", "0px");
        });
      }

      const navLinks = Array.from(document.querySelectorAll(".nav a"));
      const navSections = navLinks
        .map((link) => document.querySelector(link.getAttribute("href")))
        .filter(Boolean);
      const progressBar = document.getElementById("scroll-progress-bar");
      let scrollTicking = false;

      function updateScrollUI() {
        const scrollable = document.documentElement.scrollHeight - window.innerHeight;
        const progress = scrollable > 0 ? Math.min(1, window.scrollY / scrollable) : 0;
        progressBar.style.transform = `scaleX(${progress})`;

        let activeId = navSections[0] ? navSections[0].id : "";
        for (const section of navSections) {
          if (section.getBoundingClientRect().top <= 150) activeId = section.id;
        }
        navLinks.forEach((link) => {
          link.classList.toggle("is-active", link.getAttribute("href") === `#${activeId}`);
        });

        scrollTicking = false;
      }

      window.addEventListener("scroll", () => {
        if (!scrollTicking) {
          scrollTicking = true;
          requestAnimationFrame(updateScrollUI);
        }
      }, { passive: true });

      window.addEventListener("resize", updateScrollUI);
      updateScrollUI();

      const gallery = document.querySelector(".gallery");
      const track = document.getElementById("gallery-track");
      const frames = Array.from(track.querySelectorAll(".photo"));
      const indexButtons = Array.from(document.querySelectorAll(".index-button"));
      const currentNumber = document.getElementById("current-number");
      const prevButton = document.getElementById("prev-button");
      const nextButton = document.getElementById("next-button");
      let activeIndex = 0;
      let ticking = false;
      let isDragging = false;
      let dragMoved = false;
      let dragStartX = 0;
      let dragStartLeft = 0;
      let suppressClick = false;

      const clamp = (value) => Math.max(0, Math.min(frames.length - 1, value));
      const pad = (value) => String(value + 1).padStart(2, "0");

      function setActive(index) {
        activeIndex = clamp(index);
        frames.forEach((frame, i) => {
          frame.classList.toggle("is-active", i === activeIndex);
        });
        indexButtons.forEach((button, i) => {
          button.setAttribute("aria-current", String(i === activeIndex));
        });
        currentNumber.textContent = pad(activeIndex);
        prevButton.disabled = activeIndex === 0;
        nextButton.disabled = activeIndex === frames.length - 1;
      }

      function nearestIndex() {
        const trackRect = track.getBoundingClientRect();
        const center = trackRect.left + track.clientWidth / 2;
        let nearest = 0;
        let shortest = Infinity;

        frames.forEach((frame, i) => {
          const rect = frame.getBoundingClientRect();
          const distance = Math.abs(rect.left + rect.width / 2 - center);
          if (distance < shortest) {
            shortest = distance;
            nearest = i;
          }
        });

        return nearest;
      }

      function goTo(index, behavior = "smooth") {
        const nextIndex = clamp(index);
        const frame = frames[nextIndex];
        const trackRect = track.getBoundingClientRect();
        const frameRect = frame.getBoundingClientRect();
        const frameCenter = track.scrollLeft + frameRect.left - trackRect.left + frame.offsetWidth / 2;
        const left = frameCenter - track.clientWidth / 2;

        track.scrollTo({
          left,
          behavior: reduceMotion ? "auto" : behavior
        });
      }

      function syncActive() {
        const nearest = nearestIndex();
        if (nearest !== activeIndex) setActive(nearest);
        ticking = false;
      }

      track.addEventListener("scroll", () => {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(syncActive);
        }
      }, { passive: true });

      indexButtons.forEach((button) => {
        button.addEventListener("click", () => goTo(Number(button.dataset.target)));
      });

      prevButton.addEventListener("click", () => goTo(activeIndex - 1));
      nextButton.addEventListener("click", () => goTo(activeIndex + 1));

      gallery.addEventListener("keydown", (event) => {
        if (event.key === "ArrowLeft") {
          event.preventDefault();
          goTo(activeIndex - 1);
        }
        if (event.key === "ArrowRight") {
          event.preventDefault();
          goTo(activeIndex + 1);
        }
      });

      track.addEventListener("pointerdown", (event) => {
        if (event.pointerType !== "mouse" || event.button !== 0) return;
        isDragging = true;
        dragMoved = false;
        dragStartX = event.clientX;
        dragStartLeft = track.scrollLeft;
        track.classList.add("dragging");
        track.setPointerCapture(event.pointerId);
      });

      track.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        const distance = event.clientX - dragStartX;
        if (Math.abs(distance) > 4) dragMoved = true;
        track.scrollLeft = dragStartLeft - distance;
      });

      function finishDrag(event) {
        if (!isDragging) return;
        isDragging = false;
        track.classList.remove("dragging");
        if (track.hasPointerCapture(event.pointerId)) {
          track.releasePointerCapture(event.pointerId);
        }
        if (dragMoved) {
          suppressClick = true;
          goTo(nearestIndex());
          window.setTimeout(() => {
            suppressClick = false;
          }, 60);
        }
      }

      track.addEventListener("pointerup", finishDrag);
      track.addEventListener("pointercancel", finishDrag);

      track.addEventListener("click", (event) => {
        if (suppressClick) return;
        const frame = event.target.closest(".photo");
        if (frame) goTo(Number(frame.dataset.index));
      });

      let resizeTimer;
      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => goTo(activeIndex, "auto"), 120);
      });

      requestAnimationFrame(() => {
        goTo(0, "auto");
        setActive(0);
      });

      const toast = document.getElementById("toast");
      let toastTimer;
      const copyButton = document.getElementById("copy-email-button");
      const email = document.getElementById("contact-email").textContent.trim();

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("is-visible");
        }, 2200);
      }

      function fallbackCopy(text) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "");
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          showToast("邮箱已复制");
        } catch (error) {
          showToast(`邮箱：${text}`);
        }
        textarea.remove();
      }

      copyButton.addEventListener("click", () => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email)
            .then(() => showToast("邮箱已复制"))
            .catch(() => fallbackCopy(email));
        } else {
          fallbackCopy(email);
        }
      });

      const musicButton = document.getElementById("music-toggle");
      const musicStatus = document.getElementById("music-status");
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      const melody = [
        523.25, 659.25, 783.99, 880.00,
        783.99, 659.25, 587.33, 523.25,
        440.00, 523.25, 659.25, 783.99,
        659.25, 587.33, 523.25, 392.00
      ];
      const chordProgression = [
        [220.00, 261.63, 329.63],
        [174.61, 220.00, 261.63],
        [196.00, 261.63, 329.63],
        [196.00, 246.94, 293.66]
      ];
      const stepDuration = 0.5;
      let audioContext = null;
      let musicOutput = null;
      let musicSession = null;
      let musicTimer = null;
      let musicStep = 0;
      let nextMusicTime = 0;
      let musicPlaying = false;
      let musicStarting = false;
      let autoplayWanted = true;
      let autoplayAttempted = false;
      let unlockEventsAttached = false;
      const unlockEvents = ["pointerdown", "keydown"];

      function initMusicEngine() {
        if (!AudioContextClass) return false;
        if (audioContext) return true;

        audioContext = new AudioContextClass();
        musicOutput = audioContext.createGain();
        musicOutput.gain.value = 0.72;

        const compressor = audioContext.createDynamicsCompressor();
        compressor.threshold.value = -24;
        compressor.knee.value = 22;
        compressor.ratio.value = 4;
        compressor.attack.value = 0.02;
        compressor.release.value = 0.35;

        const delay = audioContext.createDelay(1);
        delay.delayTime.value = 0.32;
        const delayFilter = audioContext.createBiquadFilter();
        delayFilter.type = "lowpass";
        delayFilter.frequency.value = 2100;
        const feedback = audioContext.createGain();
        feedback.gain.value = 0.23;

        musicOutput.connect(compressor);
        musicOutput.connect(delay);
        delay.connect(delayFilter);
        delayFilter.connect(feedback);
        feedback.connect(delay);
        delayFilter.connect(compressor);
        compressor.connect(audioContext.destination);

        audioContext.addEventListener("statechange", () => {
          if (audioContext.state === "running" && autoplayWanted && !musicPlaying) {
            beginMusic();
          }
        });

        return true;
      }

      function connectNote(oscillator, gain, pan) {
        if (!musicSession) return;

        if (audioContext.createStereoPanner) {
          const panner = audioContext.createStereoPanner();
          panner.pan.value = pan;
          gain.connect(panner);
          panner.connect(musicSession);
          oscillator.addEventListener("ended", () => {
            oscillator.disconnect();
            gain.disconnect();
            panner.disconnect();
          }, { once: true });
          return;
        }

        gain.connect(musicSession);
        oscillator.addEventListener("ended", () => {
          oscillator.disconnect();
          gain.disconnect();
        }, { once: true });
      }

      function playBell(frequency, time, duration, volume, pan = 0) {
        if (!audioContext || !musicSession) return;

        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, time);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.exponentialRampToValueAtTime(volume, time + 0.035);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
        oscillator.connect(gain);
        connectNote(oscillator, gain, pan);
        oscillator.start(time);
        oscillator.stop(time + duration + 0.04);
      }

      function playPad(frequencies, time) {
        if (!audioContext || !musicSession) return;

        const padGain = audioContext.createGain();
        padGain.gain.setValueAtTime(0.0001, time);
        padGain.gain.linearRampToValueAtTime(0.026, time + 1.4);
        padGain.gain.setValueAtTime(0.026, time + 4.9);
        padGain.gain.exponentialRampToValueAtTime(0.0001, time + 7.8);
        padGain.connect(musicSession);

        frequencies.forEach((frequency, index) => {
          const oscillator = audioContext.createOscillator();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          oscillator.detune.value = index === 1 ? 3 : -3;
          oscillator.connect(padGain);
          oscillator.start(time);
          oscillator.stop(time + 7.9);
        });

        window.setTimeout(() => {
          padGain.disconnect();
        }, Math.max(0, (time - audioContext.currentTime + 8.1) * 1000));
      }

      function scheduleMusic() {
        if (!musicPlaying || !audioContext || !musicSession) return;

        if (nextMusicTime < audioContext.currentTime - 0.2) {
          nextMusicTime = audioContext.currentTime + 0.06;
        }

        while (nextMusicTime < audioContext.currentTime + 0.75) {
          const position = musicStep % melody.length;
          const chord = chordProgression[Math.floor(musicStep / melody.length) % chordProgression.length];

          if (position === 0) {
            playPad(chord, nextMusicTime);
          }

          playBell(melody[position], nextMusicTime, 1.85, 0.045, Math.sin(musicStep * 0.6) * 0.24);

          if (position % 4 === 0) {
            playBell(melody[position] / 2, nextMusicTime, 2.15, 0.018, -0.18);
          }

          if (position === 6 || position === 14) {
            playBell(melody[position] * 1.5, nextMusicTime + 0.24, 1.15, 0.011, 0.32);
          }

          nextMusicTime += stepDuration;
          musicStep += 1;
        }
      }

      function updateMusicUI(playing) {
        musicButton.setAttribute("aria-pressed", String(playing));
        musicButton.setAttribute("aria-label", playing ? "暂停背景音乐" : "播放背景音乐");
        musicButton.title = playing ? "暂停背景音乐" : "播放背景音乐";
        musicStatus.textContent = playing ? "播放中" : (autoplayWanted ? "等待播放" : "已暂停");
      }

      function beginMusic() {
        if (!audioContext || audioContext.state !== "running" || musicPlaying || !autoplayWanted) return;

        try {
          musicSession = audioContext.createGain();
          musicSession.gain.setValueAtTime(0.0001, audioContext.currentTime);
          musicSession.gain.exponentialRampToValueAtTime(0.9, audioContext.currentTime + 0.85);
          musicSession.connect(musicOutput);

          musicPlaying = true;
          musicStep = 0;
          nextMusicTime = audioContext.currentTime + 0.08;
          scheduleMusic();
          musicTimer = window.setInterval(scheduleMusic, 170);
          updateMusicUI(true);
          removeUnlockListeners();
        } catch (error) {
          musicPlaying = false;
          musicStatus.textContent = "播放失败";
          showToast("音乐暂时无法播放");
        }
      }

      function stopMusic() {
        if (!musicPlaying || !audioContext) return;

        musicPlaying = false;
        window.clearInterval(musicTimer);
        musicTimer = null;

        const previousSession = musicSession;
        musicSession = null;

        if (previousSession) {
          const now = audioContext.currentTime;
          previousSession.gain.cancelScheduledValues(now);
          previousSession.gain.setTargetAtTime(0.0001, now, 0.12);
          window.setTimeout(() => {
            previousSession.disconnect();
          }, 520);
        }

        updateMusicUI(false);
      }

      function handleMusicUnlock(event) {
        if (!autoplayWanted || musicPlaying) {
          removeUnlockListeners();
          return;
        }

        if (event && event.target instanceof Element && event.target.closest("#music-toggle")) {
          return;
        }

        if (!audioContext || musicStarting) return;
        musicStarting = true;
        audioContext.resume()
          .then(() => {
            if (audioContext.state === "running") beginMusic();
          })
          .catch(() => {})
          .finally(() => {
            musicStarting = false;
          });
      }

      function addUnlockListeners() {
        if (unlockEventsAttached || !audioContext) return;
        unlockEventsAttached = true;
        unlockEvents.forEach((eventName) => {
          window.addEventListener(eventName, handleMusicUnlock, { passive: true });
        });
      }

      function removeUnlockListeners() {
        if (!unlockEventsAttached) return;
        unlockEventsAttached = false;
        unlockEvents.forEach((eventName) => {
          window.removeEventListener(eventName, handleMusicUnlock);
        });
      }

      async function requestMusicAutoplay() {
        if (autoplayAttempted) return;
        autoplayAttempted = true;
        autoplayWanted = true;

        try {
          if (!initMusicEngine()) {
            musicStatus.textContent = "不可用";
            musicButton.disabled = true;
            return;
          }

          if (audioContext.state === "running") {
            beginMusic();
            return;
          }

          musicStatus.textContent = "准备播放";
          const resumeAttempt = audioContext.resume();
          if (resumeAttempt && typeof resumeAttempt.catch === "function") {
            resumeAttempt.catch(() => {});
          }

          window.setTimeout(() => {
            if (audioContext.state === "running") {
              beginMusic();
              return;
            }

            if (!musicPlaying) {
              addUnlockListeners();
              musicStatus.textContent = "轻触开始";
            }
          }, 450);
        } catch (error) {
          musicStatus.textContent = "不可用";
          musicButton.disabled = true;
        }
      }

      musicButton.addEventListener("click", async () => {
        if (musicPlaying) {
          autoplayWanted = false;
          removeUnlockListeners();
          stopMusic();
          return;
        }

        autoplayWanted = true;

        if (musicStarting) return;
        musicStarting = true;
        musicButton.disabled = true;

        try {
          if (!initMusicEngine()) {
            musicStatus.textContent = "不可用";
            return;
          }

          if (audioContext.state !== "running") {
            await audioContext.resume();
          }

          if (audioContext.state === "running") {
            beginMusic();
          } else {
            addUnlockListeners();
            musicStatus.textContent = "轻触开始";
          }
        } catch (error) {
          musicStatus.textContent = "播放失败";
          showToast("音乐暂时无法播放");
        } finally {
          musicStarting = false;
          musicButton.disabled = !AudioContextClass;
        }
      });

      window.setTimeout(requestMusicAutoplay, 260);

      document.getElementById("year").textContent = new Date().getFullYear();
    })();
  </script>
</body>
</html>
